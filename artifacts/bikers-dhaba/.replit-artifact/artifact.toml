kind = "web"
previewPath = "/"
title = "Bikers Dhaba"
description = "An official restaurant website for Bikers Dhaba in Pabna, Bangladesh, featuring its menu, restaurant atmosphere, service options, contact details, and Google Maps location."
version = "1.0.0"
id = "artifacts/bikers-dhaba"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20171

[services.development]
run = "pnpm --filter @workspace/bikers-dhaba run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bikers-dhaba", "run", "build" ]
serve = "static"
publicDir = "artifacts/bikers-dhaba/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20171"
BASE_PATH = "/"
