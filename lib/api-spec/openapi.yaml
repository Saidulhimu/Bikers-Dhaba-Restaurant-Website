openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: menu
    description: Public restaurant menu
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /menu:
    get:
      operationId: getMenu
      tags: [menu]
      summary: Get the restaurant menu
      description: Returns public menu categories and menu items with photographed board prices where legible.
      responses:
        "200":
          description: Menu data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MenuResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    MenuCategory:
      type: string
      enum:
        - Seafood
        - Dhaba favourites
        - Barbecue
        - Drinks
    MenuItem:
      type: object
      properties:
        name:
          type: string
        category:
          $ref: "#/components/schemas/MenuCategory"
        boardPrice:
          type: ["string", "null"]
      required:
        - name
        - category
        - boardPrice
    MenuResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/MenuCategory"
        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItem"
      required:
        - categories
        - items

